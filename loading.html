<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>

    <style>
        @font-face {
            font-family: 'Share Tech Mono';
            src: url('./resource/fonts/ShareTechMonoRegular_0.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:        #e60505;
            --red-bright: #ff1a1a;
            --red-dark:   #8f0303;
            --red-mid:    #b90404;
            --text:       #f2f2f2;
            --text-dim:   #9a9a9a;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Share Tech Mono', 'Arial', monospace;
            color: var(--text);
        }

        /* --- Опциональные фоновые изображения (за фигурами) --- */
        #bg-container {
            position: fixed; inset: 0;
            z-index: 0;
            background: #000;
        }
        .bg-image {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: brightness(0.55) saturate(0.9);
            transition: opacity 3s ease-in-out;
        }
        .bg-image.active { opacity: 1; }

        /* --- Красные ромбы: точная копия макета (5 шт., правый нижний угол) --- */
        #shapes {
            position: fixed; inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            animation: drift 9s ease-in-out infinite;
            will-change: transform;
        }
        /* Микроанимация: покачивание + дыхание + лёгкий поворот */
        @keyframes drift {
            0%   { transform: rotate(45deg)  translate(0, 0)         scale(1); }
            25%  { transform: rotate(46.2deg) translate(0.25vw, -0.4vw) scale(1.02); }
            50%  { transform: rotate(44.8deg) translate(-0.15vw, -0.6vw) scale(0.99); }
            75%  { transform: rotate(45.6deg) translate(-0.35vw, -0.2vw) scale(1.015); }
            100% { transform: rotate(45deg)  translate(0, 0)         scale(1); }
        }
        /* У каждого ромба свой ритм и фаза — движутся независимо */
        .s1 { width: 15.5vw; height: 15.5vw; right: -4.2vw; bottom: -3.7vw; background: #9d0404; animation-duration: 11s;  animation-delay: -2s; }   /* большой тёмный, верх кластера */
        .s2 { width: 8.2vw;  height: 8.2vw;  right: -0.8vw; bottom: -2.0vw; background: #fe0404; animation-duration: 7s;   animation-delay: -4.5s; } /* яркий, правый нижний угол */
        .s3 { width: 10.3vw; height: 10.3vw; right: 23.2vw; bottom: -5.7vw; background: #b20202; animation-duration: 9.5s; animation-delay: -6s; }   /* тёмный, левый */
        .s4 { width: 5.7vw;  height: 5.7vw;  right: 19.4vw; bottom: -4.2vw; background: #ff0000; animation-duration: 6s;   animation-delay: -1.5s; } /* яркий маленький */
        .s5 { width: 7.0vw;  height: 7.0vw;  right: 9.7vw;  bottom: -5.9vw; background: #a80808; animation-duration: 8s;   animation-delay: -3s; }   /* тёмный, внизу между ними */

        /* --- Название и карта (правый верхний угол, как на макете) --- */
        #top-right {
            position: fixed;
            top: 28px; right: 38px;
            z-index: 3;
            text-align: right;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        #top-right .title {
            font-size: 24px;
            line-height: 1;
            color: #ffffff;
            letter-spacing: 1px;
        }
        #top-right .map-line {
            margin-top: 8px;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div id="bg-container"></div>

    <div id="shapes">
        <div class="shape s1"></div>
        <div class="shape s5"></div>
        <div class="shape s3"></div>
        <div class="shape s4"></div>
        <div class="shape s2"></div>
    </div>

    <div id="top-right">
        <div class="title">fh by tz</div>
        <div class="map-line">карта: <span id="map-name"></span></div>
    </div>

    <script type="text/javascript">
// =====================================================================
// НАСТРОЙКИ
// =====================================================================
const USE_RANDOM_BACKGROUNDS = false; // true = фото-фоны за фигурами

const BACKGROUNDS = [
    './images/backgrounds/1.jpg',
    './images/backgrounds/2.png',
    './images/backgrounds/3.png',
    './images/backgrounds/4.png',
    './images/backgrounds/5.png'
];

// Треки играют по очереди (каждый по одному разу), затем порядок
// перемешивается и начинается заново — без повторов подряд.
const PLAYLIST = [
    './music/theme.mp3'
];

const MUSIC_VOLUME = 0.1;  // громкость 10%
const BG_INTERVAL_MS = 10000;

// ---------- Утилиты ----------
function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

// ---------- GMod: подстановка названия карты ----------
function GameDetails(servername, serverurl, mapname, maxplayers) {
    var m = document.getElementById('map-name');
    if (m && mapname) m.textContent = mapname;
}

// =====================================================================
// СЛУЧАЙНЫЕ ФОНОВЫЕ ИЗОБРАЖЕНИЯ (опционально, за фигурами)
// =====================================================================
(function() {
    if (!USE_RANDOM_BACKGROUNDS || BACKGROUNDS.length === 0) return;

    var container = document.getElementById('bg-container');
    var valid = [];
    var remaining = BACKGROUNDS.length;

    BACKGROUNDS.forEach(function(src) {
        var img = new Image();
        img.onload  = function() { valid.push(src); check(); };
        img.onerror = function() { check(); };
        img.src = src;
    });
    function check() { remaining--; if (remaining <= 0) start(); }

    function start() {
        if (valid.length === 0) return;
        var images = valid.map(function(src) {
            var div = document.createElement('div');
            div.className = 'bg-image';
            div.style.backgroundImage = "url('" + src + "')";
            container.appendChild(div);
            return div;
        });

        var deck = shuffleArray(valid);
        var deckIndex = 0;

        function show(src) {
            images.forEach(function(div) {
                div.classList.toggle('active', div.style.backgroundImage.indexOf(src) !== -1);
            });
        }
        function next() {
            if (deckIndex + 1 >= deck.length) {
                var last = deck[deck.length - 1];
                deck = shuffleArray(valid);
                deckIndex = 0;
                if (deck[deckIndex] === last && deck.length > 1) {
                    var t = deck[0]; deck[0] = deck[1]; deck[1] = t;
                }
            } else { deckIndex++; }
            show(deck[deckIndex]);
        }

        show(deck[0]);
        setInterval(next, BG_INTERVAL_MS);
    }
})();

// =====================================================================
// МУЗЫКА: треки по очереди, без повторов
// =====================================================================
(function() {
    var currentAudio = null;
    var order = [];
    var orderIndex = -1;
    var autoPending = false;

    function buildAudio(src) {
        var a = new Audio();
        a.src = src;
        a.preload = 'auto';
        a.loop = false;
        a.volume = MUSIC_VOLUME;
        a.addEventListener('ended', onEnded);
        a.addEventListener('error', onEnded); // битый/отсутствующий файл — пропустить
        return a;
    }

    function onEnded() {
        if (currentAudio) { currentAudio.pause(); currentAudio.remove(); currentAudio = null; }
        orderIndex++;
        if (orderIndex >= order.length) {
            order = shuffleArray(PLAYLIST);
            orderIndex = 0;
        }
        playCurrent();
    }

    function playCurrent() {
        if (order.length === 0) order = shuffleArray(PLAYLIST);
        if (orderIndex < 0 || orderIndex >= order.length) {
            order = shuffleArray(PLAYLIST);
            orderIndex = 0;
        }
        var src = order[orderIndex];
        if (!src) return;

        currentAudio = buildAudio(src);
        var p = currentAudio.play();
        if (p && p.catch) {
            p.catch(function() {
                // Автоплей заблокирован браузером — старт по первому клику/тапу
                autoPending = true;
                if (currentAudio) { currentAudio.remove(); currentAudio = null; }
            });
        }
    }

    function startPlayback() {
        if (autoPending) { autoPending = false; playCurrent(); }
    }

    playCurrent();
    ['click', 'touchstart', 'keydown'].forEach(function(ev) {
        document.addEventListener(ev, startPlayback);
    });
})();
    </script>
</body>
</html>
